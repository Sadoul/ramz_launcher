[package]
name = "ramz-stub"
version = "2.70.51"
edition = "2021"
description = "Ramz Launcher Stub"

[[bin]]
name = "Ramz-Launcher"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
dirs = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = "symbols"
